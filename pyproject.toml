[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialscout"
version = "0.1.0"
description = "Interactive visual 3D localization evaluation"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["spatialscout*"]
